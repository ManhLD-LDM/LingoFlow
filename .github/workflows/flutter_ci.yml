name: LingoFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master, LeManh ]
  pull_request:
    branches: [ main, master, LeManh ]

jobs:
  analyze_and_test:
    name: 🧪 Analyze & Unit Tests
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📄 Setup Environment Config (.env)
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: 🛠️ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Test Suite
        run: flutter test --coverage

  build_windows:
    name: 🪟 Build Windows Native (.exe)
    needs: analyze_and_test
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📄 Setup Environment Config (.env)
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: 🛠️ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Windows Release Executable
        run: flutter build windows --release

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFlow-Windows-Release
          path: build/windows/x64/runner/Release/

  build_android:
    name: 📱 Build Android Native (.apk)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📄 Setup Environment Config (.env)
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Android APK
        run: flutter build apk --debug

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFlow-Android-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
